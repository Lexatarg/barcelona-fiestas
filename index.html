<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barcelona fiestas</title>
<meta name="description" content="Hour-by-hour guides to Barcelona's festes majors, in Català, castellà and English.">
<meta property="og:title" content="Barcelona fiestas">
<meta property="og:description" content="Hour-by-hour guides to Barcelona's festes majors, in Català, castellà and English.">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#161616;--paper:#f5f3ee;--sub:#77736a;--hair:rgba(22,22,22,.16);
    --dark:#161616;--dark-ink:#f3f0e8;--dark-sub:#a29e95;--accent:#c2401d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#efece4;--paper:#111111;--sub:#98948b;--hair:rgba(239,236,228,.2);
      --dark:#000;--dark-ink:#efece4;--dark-sub:#8f8b83;--accent:#f0714c;
    }
  }
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .in{max-width:640px;margin:0 auto;}
  header{background:var(--dark);color:var(--dark-ink);padding:38px 22px 44px;}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:32px;}
  .eyebrow{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#f0714c;padding-top:6px;}
  .langs{display:flex;gap:2px;}
  .langs button{background:none;border:0;color:var(--dark-sub);cursor:pointer;font-family:inherit;
    font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 7px;}
  .langs button.on{color:#f0714c;}
  h1{margin:0;font-size:clamp(2.7rem,14vw,5rem);letter-spacing:-.045em;line-height:.92;font-weight:700;}
  .lede{margin:24px 0 0;font-size:.95rem;color:var(--dark-sub);max-width:44ch;}
  main{padding:20px 22px 0;}
  .yr{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:40px 0 4px;}
  .g{display:block;text-decoration:none;padding:24px 0 26px;border-bottom:1px solid var(--hair);}
  .g .bar{width:34px;height:6px;margin-bottom:16px;}
  .g h2{margin:0 0 6px;font-size:clamp(1.35rem,6vw,1.7rem);letter-spacing:-.035em;line-height:1.1;}
  .g .when{font-size:.83rem;font-weight:700;color:var(--sub);margin-bottom:8px;}
  .g p{margin:0;font-size:.88rem;color:var(--sub);max-width:52ch;}
  .g .open{display:inline-block;margin-top:12px;font-size:.72rem;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);}
  .g:hover h2{text-decoration:underline;text-underline-offset:4px;}
  footer{background:var(--dark);color:var(--dark-ink);margin-top:74px;padding:46px 22px 44px;}
  footer p{margin:0 0 14px;font-size:.84rem;color:var(--dark-sub);line-height:1.7;max-width:52ch;}
  @media (max-width:400px){ header{padding:32px 18px 38px;} main{padding:20px 18px 0;} footer{padding:40px 18px;} }
</style>
</head>
<body>
<header><div class="in">
  <div class="toprow">
    <div class="eyebrow" id="k-eyebrow"></div>
    <div class="langs">
      <button data-lang="ca">CAT</button>
      <button data-lang="es">CAST</button>
      <button data-lang="en" class="on">ENG</button>
    </div>
  </div>
  <h1>Barcelona<br>fiestas</h1>
  <p class="lede" id="k-lede"></p>
</div></header>

<main><div class="in" id="k-list"></div></main>

<footer><div class="in">
  <p id="k-foot1"></p>
  <p id="k-foot2"></p>
</div></footer>

<script>
/* Newest first. To add a guide, put its folder next to the others and add an entry here. */
const GUIDES = [
  { path:"festa-major-barceloneta-2026/", year:"2026", color:"#3e679c",
    title:{ca:"Festa Major de la Barceloneta",es:"Fiesta Mayor de la Barceloneta",en:"Festa Major de la Barceloneta"},
    when:{ca:"1–4 d'octubre de 2026",es:"1–4 de octubre de 2026",en:"1–4 October 2026"},
    desc:{ca:"Els quatre últims dies de la festa major del barri, amb els dos correfocs, la Cercavila del Canó i les festes dels carrers Baluard, Pescadors i del Mar.",
          es:"Los cuatro últimos días de la fiesta mayor del barrio, con los dos correfocs, la Cercavila del Canó y las fiestas de las calles Baluard, Pescadors y del Mar.",
          en:"The last four days of the neighbourhood festival, with both fire runs, the Cercavila del Canó and the street parties on Baluard, Pescadors and Carrer del Mar."} },
  { path:"la-merce-2026/", year:"2026", color:"#d8341c",
    title:{ca:"La Mercè",es:"La Mercè",en:"La Mercè"},
    when:{ca:"23–27 de setembre de 2026",es:"23–27 de septiembre de 2026",en:"23–27 September 2026"},
    desc:{ca:"La festa major de Barcelona, dia a dia: el Toc d'Inici, la diada castellera, el correfoc i el piromusical.",
          es:"La fiesta mayor de Barcelona, día a día: el Toc d'Inici, la diada castellera, el correfoc y el piromusical.",
          en:"Barcelona's own festa major, day by day: the Toc d'Inici, the human towers, the correfoc and the piromusical."} }
];

const T = {
  ca:{eyebrow:"Guies de festes majors",
      lede:"Guies hora a hora de les festes de Barcelona, en català, castellà i anglès.",
      open:"Obre la guia",
      foot1:"La informació de cada guia s'ha recollit dels programes i les pàgines oficials de cada festa. Cada guia enllaça la seva font.",
      foot2:"És un projecte personal, fet perquè tothom pugui gaudir de les festes amb més facilitat. No és una publicació oficial. Aquestes pàgines no fan servir galetes ni recullen cap dada."},
  es:{eyebrow:"Guías de fiestas mayores",
      lede:"Guías hora a hora de las fiestas de Barcelona, en catalán, castellano e inglés.",
      open:"Abrir la guía",
      foot1:"La información de cada guía se ha recogido de los programas y las páginas oficiales de cada fiesta. Cada guía enlaza su fuente.",
      foot2:"Es un proyecto personal, hecho para que todo el mundo pueda disfrutar de las fiestas con más facilidad. No es una publicación oficial. Estas páginas no usan cookies ni recogen ningún dato."},
  en:{eyebrow:"Festival guides",
      lede:"Hour-by-hour guides to Barcelona's festivals, in Catalan, Castilian and English.",
      open:"Open the guide",
      foot1:"The information in each guide was gathered from that festival's official programme and pages. Each guide links its source.",
      foot2:"This is a personal project, made so that everyone can enjoy the festivities more easily. It is not an official publication. These pages set no cookies and collect nothing."}
};

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function render(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("k-eyebrow").textContent = t.eyebrow;
  document.getElementById("k-lede").textContent = t.lede;
  document.getElementById("k-foot1").textContent = t.foot1;
  document.getElementById("k-foot2").textContent = t.foot2;
  let h = "", lastYear = null;
  GUIDES.forEach(function(g){
    if (g.year !== lastYear) { h += '<div class="yr">' + esc(g.year) + '</div>'; lastYear = g.year; }
    h += '<a class="g" href="' + g.path + '"><div class="bar" style="background:' + g.color + '"></div>' +
         '<h2>' + esc(g.title[lang]) + '</h2><div class="when">' + esc(g.when[lang]) + '</div>' +
         '<p>' + esc(g.desc[lang]) + '</p><span class="open">' + esc(t.open) + '</span></a>';
  });
  document.getElementById("k-list").innerHTML = h;
}

document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".langs button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    render(b.dataset.lang);
    try { localStorage.setItem("bcnf-lang", b.dataset.lang); } catch(e) {}
  });
});

let start = "en";
try {
  const saved = localStorage.getItem("bcnf-lang");
  if (saved && T[saved]) start = saved;
  else {
    const nl = (navigator.language || "en").toLowerCase();
    if (nl.indexOf("ca") === 0) start = "ca";
    else if (nl.indexOf("es") === 0) start = "es";
  }
} catch(e) {}
document.querySelectorAll(".langs button").forEach(function(x){ x.classList.toggle("on", x.dataset.lang === start); });
render(start);
</script>
</body>
</html>
