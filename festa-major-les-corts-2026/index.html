  .ev-top{display:flex;align-items:center;gap:7px 12px;margin-bottom:8px;flex-wrap:wrap;}
  .ev-time{font-size:.93rem;font-weight:700;letter-spacing:0;line-height:1.35;

  .ev-tags{display:flex;align-items:center;gap:7px 12px;flex-wrap:wrap;}

    border:0;border-top:1px solid var(--hair);width:100%;background:none;
    font-family:inherit;cursor:pointer;text-align:left;}
  .sheet .ar{color:var(--accent);font-weight:700;font-size:.72rem;
    text-transform:uppercase;flex:0 0 auto;}
  .sheet .close{margin-top:16px;width:100%;padding:13px;background:none;border:1px solid var(--hair);
    font-family:inherit;font-size:.72rem;font-weight:700;text-transform:uppercase;
    color:var(--sub);cursor:pointer;}
  .langs{align-items:center;}
  .theme{background:none;border:0;cursor:pointer;padding:6px 4px 6px 10px;margin:0;
    color:inherit;display:inline-flex;align-items:center;line-height:0;}
  .theme svg{width:15px;height:15px;display:block;}
  .theme .sun{display:none;}
  .theme.is-dark .sun{display:block;}
  .theme.is-dark .moon{display:none;}
</style>

function toEn(s){
  const p = String(s).split(".");
  let h = parseInt(p[0],10); const m = p[1] || "00";
  const ap = (h >= 12 && h < 24) ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  return h + ":" + m + " " + ap;
}

  return {ca:loc, es:loc, en: b ? toEn(a) + "–" + toEn(b) : toEn(a)};

    know:[
      ["Closing times","Monday to Thursday, until midnight; Friday and Saturday, until 2:00 AM; Sunday, until 11:00 PM."],
      ["Punt Lila support points","The fire run (Sat, Oct 3, from 11:00 PM, Pl. de la Concòrdia), the Miscel·lània de tradicions (Sun, Oct 4, from 10:00 AM, Pl. de Comas), the children's morning (Sat, Oct 10, from 10:00 AM, C. de Benavent), the concerts (Sat, Oct 10, from 10:00 PM, Pl. de la Concòrdia) and the young people's night (Sat, Oct 10, from midnight, Pl. del Sòl de Baix). Local groups run others in Pl. del Sòl de Baix (Fri, Oct 9) and Pl. de Can Rosés (Fri, Oct 9 and Sat, Oct 10)."],

const IDS = ["ess","d2","d3","d4","d5","d6","d7","d8","d9","d10","d11","d12","places","know"];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let L_CUR = "en";

function links(v){
  const q = encodeURIComponent(v.q);
  const rows = [
    ["Google Maps",   "https://www.google.com/maps/search/?api=1&query=" + q],
    ["Apple Maps",    "https://maps.apple.com/?q=" + q],
    ["OpenStreetMap", "https://www.openstreetmap.org/search?query=" + q]
  ];
  /* Citymapper needs coordinates; it ignores a plain address. */
  if (v.lat) rows.splice(2, 0, ["Citymapper", "https://citymapper.com/directions?endcoord=" + v.lat + "," + v.lng +
    "&endname=" + encodeURIComponent(v.n) + "&endaddress=" + q]);
  return rows;
}

function showSheet(title, sub, rows, copyValue){
  const t = T[L_CUR];
  let h = '<h3>' + esc(title) + '</h3><div class="sub">' + esc(sub) + '</div>';
  rows.forEach(function(p){
    h += '<a href="' + p[1] + '" target="_blank" rel="noopener">' + esc(p[0]) +
         '<span class="ar">' + esc(t.go) + '</span></a>';
  });
  if (copyValue) {
    h += '<button class="copy" data-val="' + esc(copyValue) + '"><span class="lab">' + esc(t.copy) + '</span></button>';
  }
  h += '<button class="close">' + esc(t.close) + '</button>';
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = h;
  document.getElementById("ovl").classList.add("open");
  sheet.querySelector(".close").onclick = closeSheet;
  const cp = sheet.querySelector(".copy");
  if (cp) cp.onclick = function(){
    const lab = cp.querySelector(".lab");
    const done = function(){ lab.textContent = T[L_CUR].copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cp.dataset.val).then(done, done);
    else done();
  };
}

function openSheet(key){
  const v = V[key];
  showSheet(v.n, T[L_CUR].openIn, links(v), v.q);
}
function closeSheet(){ document.getElementById("ovl").classList.remove("open"); }
document.getElementById("ovl").addEventListener("click", function(e){ if (e.target.id === "ovl") closeSheet(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

/* Add to calendar. The .ics file is built here in the browser; nothing is sent anywhere.
   first is the festival's first day: lower day numbers fall in the following month. */
const CAL = {id:"festa-major-les-corts-2026", year:2026, month:10, first:2, tz:"Europe/Madrid",
  url:"https://lexatarg.github.io/festes-majors-barcelona/festa-major-les-corts-2026/"};

/* Barcelona's clock rules: summer time (UTC+2) from the last Sunday of March,
   winter time (UTC+1) from the last Sunday of October. */
const VTZ = [
  "BEGIN:VTIMEZONE", "TZID:Europe/Madrid",
  "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
  "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
  "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
  "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
  "END:VTIMEZONE"
];

const pad = n => String(n).padStart(2, "0");

/* The date of day number num, moved forward by extra days. */
function calDate(num, extra){
  const day = parseInt(num, 10);
  return new Date(Date.UTC(CAL.year, CAL.month - 1 + (day < CAL.first ? 1 : 0), day + extra));
}
function ymd(dt){ return dt.getUTCFullYear() + pad(dt.getUTCMonth() + 1) + pad(dt.getUTCDate()); }

/* "21.30" on day 2 becomes "20261002T213000". Times before 6 h belong to the
   night that started the evening before, so they move to the next date. */
function icsTime(num, s){
  const p = String(s).split(".");
  const h = parseInt(p[0], 10), m = parseInt(p[1] || "0", 10);
  return ymd(calDate(num, h < 6 ? 1 : 0)) + "T" + pad(h) + pad(m) + "00";
}

/* Start and end of each session. Events with raw times (e.a, e.b) use them;
   otherwise the times are read from the Catalan label: "11 – 12 h" is one
   session with an end, "19.30 i 21 h" is two sessions, and a label with no
   hours ("Vespre") gives none, so the event is added for the whole day. */
function calSlots(e){
  if (e.a) return [[e.a, e.b]];
  const label = e.time.ca, n = label.match(/\d+(\.\d+)?/g) || [];
  if (label.indexOf("–") > -1 && n.length === 2) return [[n[0], n[1]]];
  return n.map(function(x){ return [x, null]; });
}

/* In .ics text, backslashes, semicolons, commas and line breaks need a backslash in front. */
function icsText(s){
  return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

/* Each line may be at most 75 bytes; a longer one continues on the next line,
   which starts with a space. Accented letters take 2 bytes, so count bytes. */
function icsFold(line){
  const enc = new TextEncoder();
  let out = "", cur = "", bytes = 0;
  for (const ch of line) {
    const n = enc.encode(ch).length;
    if (bytes + n > 75) { out += cur + "\r\n "; cur = ""; bytes = 1; }
    cur += ch; bytes += n;
  }
  return out + cur;
}

/* The place as text, followed by the street address when the place name alone is not one. */
function icsPlace(e, lang){
  const loc = e.loc ? e.loc[lang] : "", v = e.v ? V[e.v] : null;
  if (v && v.q) return v.q.indexOf(loc) === 0 ? v.q : loc + ", " + v.q;
  if (!loc) return v ? v.n + ", Barcelona" : "";
  return loc.indexOf("Barcelona") > -1 ? loc : loc + ", Barcelona";
}

/* Everything is written in the language the reader has chosen (lang). */
function buildIcs(d, e, i, lang){
  const t = T[lang], v = e.v ? V[e.v] : null, slots = calSlots(e);
  const link = CAL.url + "#" + d.id;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const place = icsPlace(e, lang);
  const notes = [t.calFest];
  /* An approximate time ("~20 h") or one without hours is spelt out in the notes. */
  if (!e.a && (e.time.ca.indexOf("~") > -1 || !slots.length)) notes.push(t.calTime + ": " + e.time[lang]);
  notes.push("", e.desc[lang]);
  if (e.tags.length) notes.push("", e.tags.map(function(tag){ return TAG[tag][lang]; }).join(" · "));
  if (e.tip) notes.push("", t.tipLbl + ": " + e.tip[lang]);
  if (e.link) notes.push("", t[e.link[0]] + ": " + e.link[1]);
  notes.push("", t.calGuide + ": " + link, t.calProg + ": " + t.calSrc);
  const common = ["SUMMARY;LANGUAGE=" + lang + ":" + icsText(e.title[lang])];
  if (place) common.push("LOCATION;LANGUAGE=" + lang + ":" + icsText(place));
  /* Coordinates: GEO is the standard field; the Apple one lets iPhone Calendar place a pin. */
  if (v && v.lat) {
    const q = function(s){ return String(s).replace(/"/g, "'"); };
    common.push("GEO:" + v.lat + ";" + v.lng,
      'X-APPLE-STRUCTURED-LOCATION;VALUE=URI;X-ADDRESS="' + q(v.q || v.n + ", Barcelona") +
      '";X-APPLE-RADIUS=100;X-TITLE="' + q(e.loc ? e.loc[lang] : v.n) + '":geo:' + v.lat + "," + v.lng);
  }
  common.push("DESCRIPTION;LANGUAGE=" + lang + ":" + icsText(notes.join("\n")),
              "URL:" + link, "STATUS:CONFIRMED", "TRANSP:OPAQUE");
  /* One VEVENT per session; two sessions give two entries in the same file. */
  const uid = CAL.id + "-" + d.id + "-" + i;
  const one = function(when, n){
    return ["BEGIN:VEVENT", "UID:" + uid + (n ? "-" + n : "") + "@lexatarg.github.io", "DTSTAMP:" + stamp]
      .concat(when, common, ["END:VEVENT"]);
  };
  let evs = [];
  if (!slots.length) {
    evs = one(["DTSTART;VALUE=DATE:" + ymd(calDate(d.num, 0)), "DTEND;VALUE=DATE:" + ymd(calDate(d.num, 1))], 0);
  } else slots.forEach(function(s, n){
    const when = ["DTSTART;TZID=" + CAL.tz + ":" + icsTime(d.num, s[0])];
    if (s[1]) when.push("DTEND;TZID=" + CAL.tz + ":" + icsTime(d.num, s[1]));
    evs = evs.concat(one(when, slots.length > 1 ? n + 1 : 0));
  });
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Lexatarg//Festes Majors de Barcelona//EN",
                 "CALSCALE:GREGORIAN", "METHOD:PUBLISH"].concat(VTZ, evs, ["END:VCALENDAR"]);
  return lines.map(icsFold).join("\r\n") + "\r\n";
}

/* The "Add to calendar" link. At the moment it is tapped, the file is built in
   the current language and handed to the device. iPhone opens Add to Calendar;
   Android and computers receive an .ics file that the calendar app opens. */
function calClick(a){
  const k = a.dataset.cal.split(":"), i = parseInt(k[1], 10);
  const d = DAYS.filter(function(x){ return x.id === k[0]; })[0];
  const ics = buildIcs(d, d.events[i], i, L_CUR);
  if (a.href.indexOf("blob:") === 0) URL.revokeObjectURL(a.href);
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"}));
  a.download = CAL.id + "-" + d.id + "-" + (i + 1) + ".ics";
}

function render(lang){
  L_CUR = lang;
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("k-eyebrow").textContent = t.eyebrow;
  document.getElementById("k-meta").innerHTML = t.meta.map(function(m){
    return '<div class="hm"><div class="k">' + esc(m[0]) + '</div><div class="v">' + esc(m[1]) + '</div></div>';
  }).join("");
  document.getElementById("k-lede").textContent = t.lede;

  document.getElementById("k-nav").innerHTML = IDS.map(function(id,i){
    return '<a href="#' + id + '" data-t="' + id + '">' + esc(t.nav[i]) + '</a>';
  }).join("");

  let h = "";
  h += '<section class="sec ess" id="ess"><div class="lbl">' + esc(t.essLbl) + '</div><h2>' + esc(t.essTitle) + '</h2><ol>';
  t.ess.forEach(function(e){
    h += '<li><div class="t">' + esc(e.t) + '</div><div class="w">' + esc(e.w) + '</div><div class="d">' + esc(e.d) + '</div></li>';
  });
  h += '</ol></section>';

  DAYS.forEach(function(d){
    h += '<section class="day" id="' + d.id + '"><div class="day-head"><div class="day-num">' + d.num + '</div>';
    h += '<div class="day-txt"><div class="dow">' + esc(d.dow[lang]) + '</div><h2>' + esc(d.title[lang]) + '</h2><div class="note">' + esc(d.note[lang]) + '</div></div></div>';
    h += '<div class="timeline">';
    d.events.forEach(function(e, i){
      h += '<div class="ev"><div class="ev-top"><span class="ev-time">' + esc(e.time[lang]) + '</span><span class="ev-tags">';
      e.tags.forEach(function(tag){
        h += '<span class="tg ' + (tag === "free" ? "fr" : "hi") + '">' + esc(TAG[tag][lang]) + '</span>';
      });
      h += '</span></div><h3>' + esc(e.title[lang]) + '</h3><div class="loc">' + esc(e.loc[lang]);
      if (e.v) h += ' <button class="golink" data-go="' + e.v + '">' + esc(t.dirs) + '</button>';
      h += ' <a class="golink" href="#" data-cal="' + d.id + ':' + i + '">' + esc(t.cal) + '</a>';
      if (e.link) h += ' <a class="golink" href="' + esc(e.link[1]) + '" target="_blank" rel="noopener">' + esc(t[e.link[0]]) + '</a>';
      h += '</div><p>' + esc(e.desc[lang]) + '</p>';
      if (e.tip) h += '<div class="tip"><b>' + esc(t.tipLbl) + '</b> ' + esc(e.tip[lang]) + '</div>';
      h += '</div>';
    });
    h += '</div></section>';
  });

  h += '<section class="sec" id="places"><div class="lbl">' + esc(t.placesLbl) + '</div><h2>' + esc(t.placesTitle) + '</h2>';
  h += '<p style="font-size:.86rem;color:var(--sub);margin:0;max-width:34rem">' + esc(t.placesNote) + '</p><div class="grid">';
  PLACES.forEach(function(row){
    h += '<div class="gi"><h4>' + esc(V[row.k].n) + '</h4><p>' + esc(row.d[lang]) + '</p>' +
         '<button class="golink" data-go="' + row.k + '">' + esc(t.dirs) + '</button></div>';
  });
  h += '</div><div class="callout"><b>' + esc(t.calloutB) + '</b>' + esc(t.callout) + '</div></section>';

  h += '<section class="sec" id="know"><div class="lbl">' + esc(t.knowLbl) + '</div><h2>' + esc(t.knowTitle) + '</h2><div class="grid" style="margin-top:0">';
  t.know.forEach(function(k){
    h += '<div class="gi"><h4>' + esc(k[0]) + '</h4><p>' + esc(k[1]) + '</p></div>';
  });
  h += '</div></section>';

  document.getElementById("k-body").innerHTML = h;
  document.getElementById("k-foot1").innerHTML = t.foot1;
  document.getElementById("k-foot2").innerHTML = t.foot2;
  document.getElementById("k-ver").textContent = "v" + VERSION;

  document.getElementById("k-body").querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click", function(){ openSheet(b.dataset.go); });
  });
  document.getElementById("k-body").querySelectorAll("[data-cal]").forEach(function(b){
    b.addEventListener("click", function(){ calClick(b); });
  });

  initSpy();
}

let spyObs = null;
function initSpy(){
  if (spyObs) spyObs.disconnect();
  if (typeof IntersectionObserver === "undefined") return;
  const nav = document.getElementById("k-nav");
  const anchors = Array.prototype.slice.call(nav.querySelectorAll("a"));
  const targets = IDS.map(function(id){ return document.getElementById(id); }).filter(Boolean);
  let active = null;
  function setActive(id){
    if (id === active) return;
    active = id;
    anchors.forEach(function(a){ a.classList.toggle("on", a.dataset.t === id); });
    const cur = anchors.filter(function(a){ return a.dataset.t === id; })[0];
    if (cur && nav.scrollTo) {
      nav.scrollTo({left: Math.max(0, cur.offsetLeft - nav.clientWidth/2 + cur.offsetWidth/2), behavior:"smooth"});
    }
  }
  spyObs = new IntersectionObserver(function(entries){
    const vis = entries.filter(function(e){ return e.isIntersecting; })
      .sort(function(a,b){ return a.boundingClientRect.top - b.boundingClientRect.top; });
    if (vis.length) setActive(vis[0].target.id);
  }, {rootMargin:"-86px 0px -55% 0px", threshold:0});
  targets.forEach(function(s){ spyObs.observe(s); });
}

document.querySelectorAll(".langs button[data-lang]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".langs button[data-lang]").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    render(b.dataset.lang);
    try { localStorage.setItem("bcnf-lang", b.dataset.lang); } catch(e) {}
  });
});

let start = "en";
try {
  /* "bcnf-lang" is shared by every page. */
  const saved = localStorage.getItem("bcnf-lang");
  if (saved && T[saved]) start = saved;
  else {
    const nl = (navigator.language || "en").toLowerCase();
    if (nl.indexOf("ca") === 0) start = "ca";
    else if (nl.indexOf("es") === 0) start = "es";
  }
} catch(e) {}
document.querySelectorAll(".langs button[data-lang]").forEach(function(x){ x.classList.toggle("on", x.dataset.lang === start); });
render(start);
/* Light and dark mode: follows the device until the reader picks one. */
(function(){
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var LBL = {ca:["Canvia al mode fosc","Canvia al mode clar"], es:["Cambiar al modo oscuro","Cambiar al modo claro"], en:["Switch to dark mode","Switch to light mode"]};
  function current(){ var t = root.getAttribute("data-theme"); return t ? t : (mq && mq.matches ? "dark" : "light"); }
  function sync(){
    var dark = current() === "dark", l = LBL[root.lang] || LBL.en;
    btn.classList.toggle("is-dark", dark);
    btn.setAttribute("aria-label", dark ? l[1] : l[0]);
    btn.title = dark ? l[1] : l[0];
  }
  btn.addEventListener("click", function(){
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("bcnf-theme", next); } catch(e) {}
    sync();
  });
  if (mq) { if (mq.addEventListener) mq.addEventListener("change", sync); else if (mq.addListener) mq.addListener(sync); }
  new MutationObserver(sync).observe(root, {attributes:true, attributeFilter:["lang"]});
  sync();
})();
